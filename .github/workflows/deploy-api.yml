name: Deploy Web to AKS

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'Dockerfile.web'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr build --registry supplierregistry \
            --image supplier-web:${{ github.sha }} \
            --image supplier-web:latest \
            --file Dockerfile.web \
            --build-arg VITE_API_URL=http://9.141.123.99 .

      - name: Deploy to AKS
        run: |
          az aks get-credentials --resource-group supplier --name supplier-cluster
          kubectl apply -f apps/web/k8s/deployment.yaml
          kubectl set image deployment/supplier-web supplier-web=supplierregistry.azurecr.io/supplier-web:${{ github.sha }}
