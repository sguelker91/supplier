apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplier-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: supplier-api
  template:
    metadata:
      labels:
        app: supplier-api
    spec:
      containers:
        - name: supplier-api
          image: supplierregistry.azurecr.io/supplier-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: supplier-api-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: supplier-api
spec:
  type: LoadBalancer
  selector:
    app: supplier-api
  ports:
    - port: 80
      targetPort: 3000
